<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twice-Told Tides — a spot-the-difference parlour</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1a20;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    width: min(100vw, 1280px);
    height: auto;
    cursor: pointer;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<main>
  <canvas id="stage" width="1280" height="800"></canvas>
  <p id="sr-status" class="sr-only" aria-live="polite"></p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
