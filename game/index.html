<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twice-Told Tides — a spot-the-difference game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1020;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  /* Visually hidden but announced: the screen-reader status line. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Twice-Told Tides: a spot-the-difference game with two panels side by side"></canvas>
<p id="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
